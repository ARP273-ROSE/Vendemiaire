name: tests

# Essais à chaque poussée : modèle, migrations, imports/exports, bilinguisme,
# confidentialité, kit, et l'interface sous un vrai serveur X (Xvfb). La
# publication (installeur Windows, macOS, Linux) est l'affaire de release.yml,
# déclenché par un tag « v* » — aucun tag n'est posé sans décision explicite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Essais (Linux, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Bibliothèques Qt du système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb poppler-utils libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-xkb1
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt
      - name: Tous les essais
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests/
